# backend.yml, frontend.yml이 서비스 이름과 Dockerfile을 넘겨 호출
name: Deploy

on:
  workflow_call:
    inputs:
      service:
        description: compose 서비스 이름 (app, web)
        required: true
        type: string
      image:
        description: GHCR 이미지 이름 (relay-app, relay-web)
        required: true
        type: string
      dockerfile:
        required: true
        type: string

env:
  IMAGE: ghcr.io/splleat/${{ inputs.image }}

jobs:
  image:
    name: 이미지 빌드 / 푸시
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # 이미지마다 캐시를 따로 저장
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

  deploy:
    name: 서버 배포
    needs: image
    runs-on: ubuntu-latest
    # backend와 frontend 배포가 동시에 서버를 건드리지 않도록 설정
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/relay
            git pull --ff-only origin main
            compose="docker compose -f compose.yaml -f compose.prod.yaml"
            $compose pull ${{ inputs.service }}
            $compose up -d --no-deps --no-build ${{ inputs.service }}
            docker image prune -f
