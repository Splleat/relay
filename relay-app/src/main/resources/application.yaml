spring:
  application:
    name: relay-app

  config:
    import: optional:file:.env[.properties]

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100

  session:
    timeout: 30m
    data:
      redis:
        namespace: relay:session

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: false # prod에서 활성화
        same-site: lax